# Proxy-agnostic services for Baby Sign Language.
#
# Production still runs the Next.js app on Vercel and only PostgreSQL on EC2, so
# `scripts/deploy.sh` names the postgres service explicitly and never starts the
# app. The app service exists so the whole thing can be run locally, and it is
# ready for the shared proxy through docker-compose.traefik.yml.
#
# The project name keeps its original `-database` suffix on purpose: renaming it
# would orphan the live `baby-sign-language-database_database-data` volume on
# EC2 and bring PostgreSQL up empty.

name: baby-sign-language-database

services:
  postgres:
    build:
      context: .
      dockerfile: docker/postgres/Dockerfile
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-baby_signs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.database}
      POSTGRES_DB: ${POSTGRES_DB:-baby_signs}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
      POSTGRES_TLS_HOST: ${POSTGRES_TLS_HOST:-localhost}
      POSTGRES_ALLOWED_CIDRS: ${POSTGRES_ALLOWED_CIDRS:-127.0.0.1/32}
    ports:
      - '${POSTGRES_BIND:-127.0.0.1}:${POSTGRES_PORT:-5436}:5432'
    volumes:
      - database-data:/var/lib/postgresql/data
      - database-tls:/var/lib/postgresql/tls
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-baby_signs} -d ${POSTGRES_DB:-baby_signs}']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    stop_grace_period: 60s
    shm_size: 256mb

  # No host port here; docker-compose.override.yml publishes one for standalone
  # use and docker-compose.traefik.yml routes to it through the shared proxy.
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_CACHE_VERSION: ${NEXT_PUBLIC_CACHE_VERSION:-1}
    restart: unless-stopped
    expose:
      - '3000'
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-baby_signs}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-baby_signs}?sslmode=require&connection_limit=5&pool_timeout=10&connect_timeout=10
    depends_on:
      postgres:
        condition: service_healthy

  # Invoked explicitly by scripts/up-local.sh and scripts/deploy.sh. The profile
  # prevents an ordinary `docker compose up` from leaving a migration container.
  migrate:
    profiles: [tools]
    build:
      context: .
      dockerfile: docker/migrate/Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-baby_signs}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-baby_signs}?sslmode=require&connection_limit=1
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

volumes:
  database-data:
  database-tls:
