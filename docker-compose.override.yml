# Automatically loaded by plain `docker compose` commands. This is the portable
# standalone experience: the app answers on a loopback port with no proxy and no
# pre-existing Docker network.
#
# Traefik deployments pass their files with -f explicitly, which skips this one.

services:
  app:
    ports:
      - '${APP_BIND:-127.0.0.1}:${APP_PORT:-3082}:3000'
