# Optional integration with the shared proxy in ~/projects/hobby-traefik, used
# by both local and production deployments. Combine with docker-compose.yml and
# do not use the standalone override alongside it.
#
# Only the app joins traefik-public. PostgreSQL stays on the private default
# network and keeps its own dedicated TCP port, because it is not HTTP traffic.

services:
  app:
    networks:
      - default
      - traefik-public
    labels:
      traefik.enable: 'true'
      traefik.docker.network: traefik-public
      traefik.http.routers.baby-sign-language.rule: 'Host(`${APP_HOST:?Set APP_HOST in .env}`)'
      traefik.http.routers.baby-sign-language.entrypoints: web
      traefik.http.routers.baby-sign-language.service: baby-sign-language
      traefik.http.routers.baby-sign-language.middlewares: baby-sign-language-compress@docker,baby-sign-language-security@docker
      traefik.http.services.baby-sign-language.loadbalancer.server.port: '3000'
      traefik.http.services.baby-sign-language.loadbalancer.server.scheme: http
      traefik.http.services.baby-sign-language.loadbalancer.healthcheck.path: /api/health
      traefik.http.services.baby-sign-language.loadbalancer.healthcheck.interval: 30s
      traefik.http.services.baby-sign-language.loadbalancer.healthcheck.timeout: 5s
      traefik.http.middlewares.baby-sign-language-compress.compress: 'true'
      traefik.http.middlewares.baby-sign-language-security.headers.stsSeconds: '31536000'
      traefik.http.middlewares.baby-sign-language-security.headers.contentTypeNosniff: 'true'
      traefik.http.middlewares.baby-sign-language-security.headers.frameDeny: 'true'
      traefik.http.middlewares.baby-sign-language-security.headers.referrerPolicy: no-referrer

networks:
  traefik-public:
    external: true
