name: Deploy EC2 database

on:
  push:
    branches: [main]
    paths:
      - 'docker-compose.yml'
      - 'docker/**'
      - 'prisma/**'
      - 'scripts/deploy.sh'
      - 'scripts/backup.sh'
      - '.github/workflows/deploy-database.yml'
  workflow_dispatch:

concurrency:
  group: baby-sign-language-database-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts

      - name: Deploy database
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$EC2_USER@$EC2_HOST" \
            'cd "$HOME/projects/baby-sign-language" && bash ./scripts/deploy.sh'
